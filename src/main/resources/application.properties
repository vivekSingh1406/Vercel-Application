server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/appdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.max-file-size=1500000B
spring.servlet.multipart.max-request-size=2MB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.serialization.write-dates-as-timestamps=false
app.whatsapp-number=${WHATSAPP_NUMBER:919755752534}
app.admin-password=${ADMIN_PASSWORD:MVPL}
app.admin-username=${ADMIN_USERNAME:Microvista}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/mysql
app.upload-dir=${UPLOAD_DIR:./uploads}
# Optional local credentials; this file is deliberately excluded from Git.
spring.config.import=optional:file:./application-local.properties
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
# Server-only question catalog and learner session lifetime.
app.exam.catalog=${EXAM_CATALOG:classpath:exams/general-knowledge.json}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
