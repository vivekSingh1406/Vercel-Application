<a href="#main-content" class="skip-link">Skip to content</a><app-navbar />
<main id="main-content" tabindex="-1"><router-outlet /></main>
<app-footer /><app-whatsapp-button [floating]="true" />
@if (scrolled()) {
  <button class="scroll-top icon-button" (click)="top()" aria-label="Scroll to top">
    <app-icon name="up" />
  </button>
}
<div class="toast-region" aria-live="polite" aria-atomic="true">
  @if (toast.message()) {
    <div class="toast">
      <app-icon name="chat" /><span>{{ toast.message() }}</span
      ><button
        class="icon-button"
        aria-label="Dismiss notification"
        (click)="toast.message.set('')"
      >
        <app-icon name="close" />
      </button>
    </div>
  }
</div>
